{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="narrow center error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('scan.index') }}">Go to the scanner</a>
</div>
{% endblock %}
