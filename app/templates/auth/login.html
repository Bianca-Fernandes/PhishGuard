{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Log in</h1>
  <form method="post" class="card form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autocomplete="username" autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="center muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
